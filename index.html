<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Traky</title>
<meta name="description" content="Hábitos y tareas con palancas, en una hoja simple.">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Traky">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon.png">
<style>
/* Traky · una sola paleta clara, un acento (azul) para acción, progreso y palanca. */
:root{
  --bg:#FFFFFF; --soft:#F4F5F7; --sunken:#F1F2F5; --line:#ECEDF1; --line-2:#D6D8E0;
  --fg:#16171C; --fg-2:#3C3E49; --muted:#5F6270; --faint:#A4A7B2;
  --accent:#3447E6; --accent-soft:rgba(52,71,230,.07); --accent-line:rgba(52,71,230,.24); --accent-row:#EEF0FD;
  --danger:#B42318;
  --sans:-apple-system,"SF Pro Text","SF Pro Display",system-ui,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --rh:38px; --tab:58px;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{padding-top:var(--st);padding-bottom:calc(var(--tab) + var(--sb) + 24px);overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:var(--st);background:var(--bg);z-index:30}
button,input,textarea,select{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0}
[hidden]{display:none!important}
.wrap{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}

/* top */
.top{padding-block:8px 12px;display:flex;flex-direction:column;gap:10px}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}
.title{font-size:25px;font-weight:700;letter-spacing:.01em;line-height:1.1}
.eyebrow{font-size:11px;letter-spacing:.09em;font-weight:600;color:var(--muted);text-transform:uppercase}
.fab{width:44px;height:44px;border-radius:22px;background:var(--accent);display:grid;place-items:center;flex:none}
.fab svg{stroke:#fff}
.icon44{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;flex:none}
.icon44 svg{stroke:var(--fg-2)}
.icon44:disabled svg{stroke:#C9CBD3}
.mnav{display:flex;align-items:center;margin-left:-12px;min-width:0}
.mnav .title{white-space:nowrap}
.mantra{display:flex;align-items:baseline;gap:10px}
.mantra input{flex:1;min-width:0;border:0;border-bottom:1px dashed var(--line-2);background:transparent;outline:none;padding:3px 0;font-size:16px;border-radius:0}
.mantra input:focus{border-bottom-color:var(--accent)}
.mantra input::placeholder{color:var(--faint)}
.kpis{display:flex;gap:22px}
.kpis div{display:flex;flex-direction:column}
.kpis b{font-family:var(--mono);font-size:18px;font-weight:500}
.kpis span{font-size:12px;color:var(--muted)}

/* habit sheet grid */
.gwrap{border-top:1px solid var(--line-2)}
.gwrap.scrollx{overflow-x:auto}
.ginner{min-width:100%}
.gh{display:grid;height:146px;border-bottom:1px solid var(--line-2);position:sticky;top:var(--st);background:var(--bg);z-index:5}
.gwrap.scrollx .gh{position:static}
.gh>*{border-left:1px solid var(--line);min-width:0}
.gh>:first-child{border-left:0}
.ghd{display:flex;align-items:flex-end;padding:0 0 9px 12px;font-size:10px;letter-spacing:.08em;font-weight:600;color:var(--muted)}
.ghh{display:flex;align-items:flex-end;justify-content:center;padding-bottom:9px;width:100%}
.ghh span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:12.5px;font-weight:500;color:var(--fg-2);white-space:nowrap;max-height:128px;overflow:hidden;text-overflow:ellipsis}
.ghh:active{background:var(--accent-soft)}
.gha{position:relative}
.gha .t{position:absolute;left:10px;top:10px;font-size:10px;letter-spacing:.08em;font-weight:600;color:var(--muted)}
.gha .n{position:absolute;bottom:9px;transform:translateX(-50%);font-family:var(--mono);font-size:10px;color:var(--muted)}
.rows{position:relative}
.gr{display:grid;height:var(--rh);border-bottom:1px solid var(--line)}
.gr>*{border-left:1px solid var(--line)}
.gr>:first-child{border-left:0}
.gr.now{background:var(--accent-row)}
.gday{display:flex;align-items:center;gap:4px;padding-left:10px;font-family:var(--mono);height:100%}
.gday b{font-size:13px;font-weight:500;width:18px;text-align:right}
.gday i{font-style:normal;font-size:9.5px;color:var(--faint)}
.gr.wk .gday b{color:var(--muted)}
.gr.now .gday b{color:var(--accent);font-weight:700}
.gc{display:grid;place-items:center;height:100%;width:100%}
.gc svg{stroke:var(--accent);transition:transform .15s}
.gc .box{width:12px;height:12px;border-radius:3px;box-shadow:inset 0 0 0 1.2px #C9CBD3}
.gc .dot{width:3px;height:3px;border-radius:2px;background:var(--line-2)}
.gc .fut{width:10px;height:10px;border-radius:3px;box-shadow:inset 0 0 0 1px var(--line)}
button.gc:active{background:var(--accent-soft)}
.gc.pop svg{animation:pop .22s ease-out}
@keyframes pop{0%{transform:scale(.4) rotate(-25deg)}70%{transform:scale(1.15)}100%{transform:none}}
#jchart{position:absolute;right:0;top:0;pointer-events:none}
.gfoot{display:flex;gap:6px 14px;flex-wrap:wrap;padding-block:12px;font-size:12.5px;color:var(--muted);align-items:center}
.gfoot svg{stroke:var(--accent)}
.gfoot span{display:inline-flex;align-items:center;gap:6px}

/* habits v3: Semana | Mes */
.hseg{display:grid;grid-template-columns:1fr 1fr;padding:3px;border-radius:11px;background:var(--sunken)}
.hseg button{height:38px;border-radius:9px;font-size:14.5px;font-weight:500;color:var(--muted)}
.hseg button[aria-selected="true"]{background:#fff;color:var(--fg);box-shadow:0 1px 3px rgba(14,15,20,.12)}
.wtitle{display:flex;align-items:center;gap:2px;margin-left:-12px;min-width:0}
.wtitle .tx{display:flex;flex-direction:column;gap:2px;min-width:0;padding:0 2px}
.wtitle h1{font-size:25px;font-weight:700;letter-spacing:-.01em;line-height:1.1;white-space:nowrap}
.rings{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:12px max(10px,env(safe-area-inset-left,0px)) 4px max(10px,env(safe-area-inset-right,0px))}
.ring{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0 8px;border-radius:14px}
.ring[aria-pressed="true"]{background:var(--sunken)}
.ring:disabled{cursor:default}
.ring .l{font-size:11px;font-weight:600;color:var(--muted)}
.ring.today .l{color:var(--accent)}
.ring svg circle.p{transition:stroke-dasharray .35s}
.selbar{padding-block:8px 14px;display:flex;flex-direction:column;gap:8px}
.selbar .r1{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.selbar .r1 b{font-size:16.5px;font-weight:600}
.selbar .r1 span{font-family:var(--mono);font-size:15px;font-weight:500}
.selbar .r1 span small{font-size:15px;color:var(--muted)}
.wlist{border-top:1px solid var(--line)}
.wrow{display:flex;align-items:center;gap:10px;min-height:68px;border-bottom:1px solid var(--line);padding-left:max(11px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.wck{width:44px;height:44px;display:grid;place-items:center;flex:none}
.wck span{width:30px;height:30px;border-radius:9px;box-shadow:inset 0 0 0 1.6px #C9CBD3;display:grid;place-items:center;transition:background .15s}
.wck span svg{stroke:#fff;opacity:0}
.wck[aria-pressed="true"] span{background:var(--accent);box-shadow:none}
.wck[aria-pressed="true"] span svg{opacity:1}
.wck.pop span{animation:pop .22s ease-out}
.wfree{width:44px;height:44px;display:grid;place-items:center;flex:none;font-size:11.5px;color:#6F727E}
.wname{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;text-align:left;min-height:56px;justify-content:center}
.wname b{font-size:16px;font-weight:500;overflow-wrap:anywhere}
.wname span{font-size:12.5px;color:var(--muted)}
.wrow.off .wname b{color:#6F727E}
.wdots{display:flex;gap:4px;flex:none}
.wdots i{width:12px;height:22px;display:grid;place-items:center}
.wdots i::before{content:"";width:10px;height:18px;border-radius:4px;box-shadow:inset 0 0 0 1.2px #C9CBD3;background:#fff}
.wdots i.y::before{background:var(--accent);box-shadow:none}
.wdots i.f::before{box-shadow:inset 0 0 0 1px var(--line);background:transparent}
.wdots i.o::before{width:4px;height:4px;border-radius:2px;background:var(--line-2);box-shadow:none}
.wdots i.s::before{outline:1.5px solid var(--fg);outline-offset:1.5px}
.spark{display:flex;flex-direction:column;gap:8px;width:100%;padding-block:16px 4px;text-align:left}
.spark .r1{display:flex;justify-content:space-between;align-items:baseline;width:100%}
.spark .r1 b{color:var(--accent);font-size:13.5px;font-weight:600}
.mchart{padding-block:12px 2px}
.mchart svg text{font-family:var(--mono)}
.mchart .hit{fill:transparent;cursor:pointer}
.mkpis{padding-block:6px 14px;border-bottom:1px solid var(--line-2)}
.mticks{position:relative;height:22px;margin-top:8px;font-family:var(--mono);font-size:10px;color:var(--muted)}
.mticks span{position:absolute;top:5px;transform:translateX(-50%)}
.mticks span.t{color:var(--accent);font-weight:600}
.mrow{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.mrow .mb{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;padding:11px 0 13px max(18px,env(safe-area-inset-left,0px));text-align:left}
.mrow .r1{display:flex;align-items:baseline;justify-content:space-between;gap:10px;width:100%}
.mrow .r1 b{font-size:15.5px;font-weight:500;min-width:0;overflow-wrap:anywhere}
.mrow .r1 span{font-family:var(--mono);font-size:12px;color:var(--muted);flex:none}
.mrow .r1 em{font-style:normal;font-size:11.5px;font-weight:600;color:var(--accent);margin-right:6px;font-family:var(--sans)}
.mrow .ed{width:44px;flex:none;display:grid;place-items:center;color:var(--muted);margin-right:max(2px,env(safe-area-inset-right,0px))}
.mleg{display:flex;gap:6px 14px;flex-wrap:wrap;padding-block:12px;font-size:12.5px;color:var(--muted);align-items:center}
.mleg span{display:inline-flex;align-items:center;gap:6px}
.mleg i{width:9px;height:14px;border-radius:3px;display:block}

/* empty */
.empty{padding-block:28px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.empty h3{font-size:18px;font-weight:600}
.empty p{margin:0;color:var(--muted);font-size:15px;line-height:1.45;max-width:40ch}
.btn{height:48px;padding:0 18px;border-radius:14px;font-size:16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-p{background:var(--accent);color:#fff}
.btn-g{background:var(--sunken);color:var(--fg)}
.btn-t{color:var(--accent);height:44px;padding:0 6px}
.btn-d{background:#FDECEA;color:var(--danger)}
.btn-block{width:100%}
.acts{display:flex;gap:8px;flex-wrap:wrap}

/* today */
.prog{display:flex;flex-direction:column;gap:8px;padding-block:6px 4px}
.prog .big{font-family:var(--mono);font-size:34px;font-weight:500;letter-spacing:-.03em;line-height:1}
.prog .big small{font-size:16px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--sunken);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--accent);transition:width .35s}
.hlist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:14px;min-height:58px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.hrow .ck{width:30px;height:30px;border-radius:9px;box-shadow:inset 0 0 0 1.6px #C9CBD3;display:grid;place-items:center;flex:none;transition:background .15s}
.hrow .ck svg{stroke:#fff;opacity:0}
.hrow[aria-pressed="true"] .ck{background:var(--accent);box-shadow:none}
.hrow[aria-pressed="true"] .ck svg{opacity:1}
.hrow .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.hrow .tx b{font-size:16px;font-weight:500}
.hrow .tx span{font-size:13px;color:var(--muted)}
.blk{margin-top:26px;display:flex;flex-direction:column;gap:10px}
.blk h2{font-size:11px;letter-spacing:.09em;font-weight:600;color:var(--muted);display:flex;justify-content:space-between}
.lvcard{display:flex;flex-direction:column;gap:8px;padding:13px 14px;border-radius:14px;background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent-line);text-align:left;width:100%}
.lvcard .from{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)}
.lvcard .from i{width:7px;height:7px;border-radius:4px;flex:none}
.lvcard .lv{display:flex;gap:8px;align-items:flex-start;font-size:15px;font-weight:500;line-height:1.35}
.lvcard .lv svg{stroke:var(--accent);flex:none;margin-top:3px}

/* tasks */
.kgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:0 -6px}
.kbtn{min-height:54px;padding:6px;border-radius:12px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;text-align:left}
.kbtn b{font-family:var(--mono);font-size:18px;font-weight:500;line-height:1.2}
.kbtn span{font-size:12px;color:var(--muted)}
.kbtn[aria-pressed="true"]{background:var(--sunken);box-shadow:inset 0 0 0 1.5px var(--fg)}
.kbtn.blue b{color:var(--accent)}
.fbar{display:flex;align-items:center;justify-content:space-between;height:34px}
.fbar span{font-size:13.5px;color:var(--fg-2)}
.fbar button{height:34px;padding:0 12px;border-radius:17px;background:var(--sunken);color:var(--accent);font-size:13.5px;font-weight:500}
.tsheet{border-top:1px solid var(--line-2)}
.cathead{display:flex;align-items:center;gap:10px;height:48px;border-bottom:1px solid;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.cathead .tog{flex:1;display:flex;align-items:center;gap:10px;height:100%;text-align:left;min-width:0}
.cathead .dot{width:8px;height:8px;border-radius:4px;flex:none}
.cathead .nm{font-size:11px;letter-spacing:.09em;font-weight:600;flex:1;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cathead .ct{font-family:var(--mono);font-size:12px;color:var(--muted)}
.cathead .chev{stroke:var(--muted);transition:transform .2s;flex:none}
.cathead .more{color:var(--muted)}
.deck{padding:12px 16px 26px;border-bottom:1px solid}
.deck button{position:relative;display:block;width:100%;text-align:left}
.deck .l2,.deck .l1{position:absolute;border-radius:14px;background:#fff;display:block}
.deck .l2{left:22px;right:22px;top:12px;bottom:-12px;opacity:.6}
.deck .l1{left:11px;right:11px;top:6px;bottom:-6px;opacity:.85}
.deck .front{position:relative;display:flex;flex-direction:column;gap:6px;padding:13px 14px;border-radius:14px;background:#fff}
.deck .t1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.deck .t1 b{font-size:15.5px;font-weight:500;min-width:0}
.deck .lvm{display:flex;gap:7px;font-size:13px;line-height:1.35}
.deck .lvm svg{stroke:var(--accent);flex:none;margin-top:2px}
.deck .more{font-size:12.5px;font-weight:500}
.trow{display:grid;grid-template-columns:52px minmax(0,1fr);border-bottom:1px solid var(--line)}
.trow .st{width:52px;height:52px;display:grid;place-items:center;margin-top:1px}
.trow .op{display:flex;flex-direction:column;gap:3px;padding:15px max(18px,env(safe-area-inset-right,0px)) 15px 0;text-align:left;min-width:0;width:100%}
.trow .l1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.trow .l1 b{font-size:16px;font-weight:500;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.trow .dt{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;flex:none}
.trow .dt.late{color:var(--danger)}
.trow .ds{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow.done .l1 b{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.lvchip{display:flex;gap:8px;align-items:flex-start;margin-top:7px;padding:8px 10px;border-radius:10px;background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent-line);font-size:13.5px;line-height:1.35}
.lvchip svg{stroke:var(--accent);flex:none;margin-top:2px}
.lvchip em{font-style:normal;font-size:10px;letter-spacing:.09em;font-weight:600;color:var(--accent);margin-right:5px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));height:calc(var(--tab) + var(--sb));padding:6px max(12px,env(safe-area-inset-left,0px)) var(--sb);background:rgba(255,255,255,.92);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);border-top:1px solid #E7E8ED}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:#6F727E;text-decoration:none}
.tabbar a svg{stroke:currentColor}
.tabbar a[aria-current="page"]{color:var(--accent);font-weight:600}

/* bottom sheet */
.scrim{position:fixed;inset:0;background:rgba(14,15,20,.34);z-index:40;opacity:0;transition:opacity .22s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:#fff;border-radius:22px 22px 0 0;max-height:calc(100% - var(--st) - 24px);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(14,15,20,.18)}
.sheet.on{transform:none}
.sheet .grab{display:flex;justify-content:center;padding-top:8px;flex:none}
.sheet .grab span{width:38px;height:5px;border-radius:3px;background:var(--line-2)}
.sheet .sb{overflow:auto;padding:12px 22px 8px;display:flex;flex-direction:column;gap:18px;-webkit-overflow-scrolling:touch}
.sheet .sf{padding:12px 22px calc(16px + var(--sb));display:flex;gap:10px;flex:none;border-top:1px solid var(--line)}
.sheet .sf .btn-p{flex:1}
.shead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.shead h3{font-size:23px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.fld{display:flex;flex-direction:column;gap:8px}
.fld>label,.fld>.lab{font-size:11px;letter-spacing:.09em;font-weight:600;color:var(--muted);text-transform:uppercase}
.fld input[type=text],.fld textarea,.fld input[type=date]{width:100%;font-size:17px;border:0;border-radius:12px;background:var(--soft);padding:14px 16px;outline:none;color:var(--fg);-webkit-appearance:none;appearance:none}
.fld input[type=date]{min-height:50px}
.fld textarea{resize:none;line-height:1.4;min-height:72px}
.fld input:focus,.fld textarea:focus{box-shadow:0 0 0 1.5px var(--accent),0 0 0 5px rgba(52,71,230,.1);background:#fff}
.fld.err input,.fld.err textarea{box-shadow:0 0 0 1.5px var(--danger)}
.fld .em{display:none;font-size:13px;color:var(--danger)}
.fld.err .em{display:block}
.fld .help{font-size:13px;color:var(--muted)}
.fld.lev textarea{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent-line)}
.fld.lev>label{color:var(--accent);display:flex;align-items:center;gap:6px}
.fld.lev>label svg{stroke:var(--accent)}

const SB_URL = 'https://hwpbuegdhlhxiyqrvior.supabase.co';

  load(){ return readLocal(KEY) || fresh(); },
  write(d){ return ls.set(KEY, JSON.stringify(d)); },
  save(d){ const ok = this.write(d); Sync.touch(); return ok; }
};
const Sync = {
  state: 'local', t: 0, busy: false, again: false,
  rev(){ return +(ls.get(KEY+'.rev') || 0); },
  setRev(n){ ls.set(KEY+'.rev', String(n)); },
  dirty(){ return ls.get(KEY+'.dirty') === '1'; },
  setDirty(b){ b ? ls.set(KEY+'.dirty','1') : ls.del(KEY+'.dirty'); },
  touch(){
    if(!USER) return;
    this.setRev(Date.now()); this.setDirty(true); this.state = 'pending';
    clearTimeout(this.t); this.t = setTimeout(() => this.push(), 700); this.paint();
  },
  async push(){
    if(!USER || !sb || !this.dirty()) return true;
    if(this.busy){ this.again = true; return false; }
    this.busy = true; const rev = this.rev();
    let ok = false;
    try{ const { error } = await sb.from('traky_data').upsert({ user_id: USER.id, data: D, rev }); ok = !error; }catch(e){}
    this.busy = false;
    if(ok && this.rev() === rev) this.setDirty(false);
    this.state = ok ? (this.dirty() ? 'pending' : 'ok') : 'error';

  },
  async fetch(){
    try{ const { data, error } = await sb.from('traky_data').select('data,rev').eq('user_id', USER.id).maybeSingle(); if(error) return { error }; return { row: data }; }
    catch(e){ return { error: e }; }
  },
  async pull(){
    if(!USER || !sb) return;
    if(this.dirty()){ await this.push(); return; }
    const { row, error } = await this.fetch();
    if(error){ this.state = 'error'; this.paint(); return; }
    if(row && +row.rev > this.rev()){ D = migrate(normalize(row.data)); Store.write(D); this.setRev(+row.rev); if(!sheetEl) render(); }
    this.state = 'ok'; this.paint();
  },
  label(){ return { ok:'Sincronizado', pending:'Guardando…', error:'Sin conexión · se sincroniza al volver', local:'Solo en este teléfono' }[this.state]; },
  paint(){ const el = document.querySelector('[data-sync]'); if(el){ el.dataset.state = this.state; el.querySelector('span').textContent = this.label(); } }
};
async function enterUser(u){
  USER = { id:u.id, email:u.email || '', name:(u.user_metadata && (u.user_metadata.full_name || u.user_metadata.name)) || '' };
  ls.set('traky.lastUser', JSON.stringify(USER)); ls.del('traky.mode');
  KEY = LOCAL_KEY + '.' + USER.id;
  const local = readLocal(KEY);
  const { row, error } = await Sync.fetch();
  if(row && (!local || (+row.rev > Sync.rev() && !Sync.dirty()))){
    D = migrate(normalize(row.data)); Store.write(D); Sync.setRev(+row.rev); Sync.setDirty(false); Sync.state = 'ok';
  } else if(local){
    D = migrate(local); Sync.state = error ? 'error' : 'ok';
    if(Sync.dirty() || (!row && !error)){ Sync.setDirty(true); Sync.push(); }
  } else if(!error){
    // Primera vez con esta cuenta: lo que había en el teléfono pasa a la cuenta.
    const phone = readLocal(LOCAL_KEY);
    D = migrate(phone || fresh()); Store.write(D); Sync.touch();
    if(phone && (phone.habits.length || phone.tasks.length)) setTimeout(() => toast('Tus datos de este teléfono quedaron en tu cuenta'), 400);
  } else {
    D = migrate(fresh()); Sync.state = 'error';
  }
}
async function signIn(){

async function signOut(){
  const ok = await Sync.push();

function migrate(d){

/* ---------- habits domain ---------- */
const activeHabits = () => D.habits.filter(h => !h.archivedAt);
/* El historial no se reescribe: cada cambio de frecuencia se guarda con su fecha

function ruleOn(h, k){ const s = h.sched || []; let r = s[0]; for(const x of s) if(x.from <= k) r = x; return r || {freq:h.freq, days:h.days||[]}; }

  if(h.createdAt && k < h.createdAt) return false;
  if(h.archivedAt && k >= h.archivedAt) return false;
  if((h.pauses||[]).some(p => k >= p.from && k < p.to)) return false;
  const r = ruleOn(h, k);
  return r.freq === 'daily' || (r.days||[]).includes(dow(k));
}
function setSchedule(h, freq, days){
  const t = today(), cur = ruleOn(h, t);
  const same = cur.freq === freq && (freq === 'daily' || [...cur.days].sort().join() === [...days].sort().join());
  h.freq = freq; h.days = days;
  if(same) return;
  h.sched = (h.sched || []).filter(x => x.from !== t);
  if(h.createdAt === t) h.sched = [];
  h.sched.push({from: t, freq, days});
  h.sched.sort((a,b) => a.from < b.from ? -1 : 1);
}
const marksOf = id => Object.values(D.log).reduce((n,v) => n + (v.includes(id)?1:0), 0);
function archiveHabit(h){ h.archivedAt = today(); }
function restoreHabit(h){ if(h.archivedAt){ if(h.archivedAt < today()) h.pauses = (h.pauses||[]).concat([{from:h.archivedAt, to:today()}]); h.archivedAt = null; } }
function purgeHabit(id){
  D.habits = D.habits.filter(x => x.id !== id);
  for(const k in D.log){ D.log[k] = D.log[k].filter(i => i !== id); if(!D.log[k].length) delete D.log[k]; }
}
function dayStats(k){
  const sched = D.habits.filter(h => scheduledOn(h, k)), log = D.log[k] || [];
  const done = sched.filter(h => log.includes(h.id));
  return { k, sched, n: done.length, total: sched.length, perfect: sched.length > 0 && done.length === sched.length };
}
function earliest(){ let e = today(); for(const h of D.habits) if(h.createdAt && h.createdAt < e) e = h.createdAt; return e; }
function currentStreak(){
  let k = today(); if(!dayStats(k).perfect) k = addDays(k,-1);

  for(let i=0; i<1500 && k>=stop; i++){ const s = dayStats(k); if(!s.total){ k=addDays(k,-1); continue; } if(s.perfect){ c++; k=addDays(k,-1); } else break; }

}
function habitStreak(h){
  let k = today(); if(!(scheduledOn(h,k) && (D.log[k]||[]).includes(h.id))) k = addDays(k,-1);
  let c = 0; for(let i=0; i<1500 && k >= (h.createdAt||k); i++){ if(!scheduledOn(h,k)){ k=addDays(k,-1); continue; } if((D.log[k]||[]).includes(h.id)){ c++; k=addDays(k,-1); } else break; }

}

const monthHabits = mi => D.habits.filter(h => (!h.createdAt || h.createdAt <= mi.end) && (!h.archivedAt || h.archivedAt > mi.start));

/* Progreso mes a mes: % de hábitos cumplidos sobre los programados de cada mes. */
function monthSeries(max){
  const t = today(), cur = t.slice(0,7), first = earliest().slice(0,7), out = [];
  let [y,m] = cur.split('-').map(Number);

    const mi = monthInfo(ym), end = mi.end < t ? mi.end : t;
    out.unshift({ ym, pct: rangePct(mi.start, end), cur: ym === cur });
    m--; if(!m){ m = 12; y--; }
  }
  return out;
}
function monthBars(sel){

  const best = vals.length ? vals.reduce((a,x) => x.pct > a.pct ? x : a) : null;
  const prev = ms.length > 1 ? ms[ms.length-2].pct : null, now = ms[ms.length-1].pct;
  const delta = (prev != null && now != null) ? now - prev : null;

    return `<button class="mbar${on?' on':''}${x.cur?' cur':''}" data-act="goto-month" data-ym="${x.ym}" aria-label="${esc(cap(monthName(x.ym)))}: ${x.pct==null?'sin datos':x.pct+'%'}" aria-pressed="${on}">

    <div class="mbars" style="--n:${ms.length}">${bars}</div>
    ${vals.length>1?`<div class="mpk"><span>Promedio <b>${avg}%</b></span><span>Mejor mes <b>${esc(cap(monthName(best.ym)))} · ${best.pct}%</b></span></div>`:''}</div>`;

function viewMonth(){
  const mi = monthInfo(UI.month), t = today(), isCur = UI.month === t.slice(0,7), end = mi.end < t ? mi.end : t, first = earliest();
  const ts = dayStats(t), mo = mi.start <= t ? rangePct(mi.start, end) : null;
  const mantra = (D.meta.mantra||{})[UI.month] || '';
  const head = `<div class="top wrap"><div class="toprow"><div class="mnav">
      <button class="icon44" data-act="month" data-n="-1" aria-label="Mes anterior">${I.left}</button>
      <h1 class="title">${esc(monthName(UI.month).toUpperCase())} ${mi.y}</h1>
      <button class="icon44" data-act="month" data-n="1" aria-label="Mes siguiente" ${isCur?'disabled':''}>${I.right}</button></div>
      <button class="fab" data-act="new-habit" aria-label="Nuevo hábito">${I.plus}</button></div>${hSeg()}
    <label class="mantra"><span class="eyebrow">Mantra</span><input type="text" data-mantra="${UI.month}" maxlength="80" value="${esc(mantra)}" placeholder="La intención del mes" enterkeyhint="done" autocomplete="off"></label>${installHint()}</div>`;

  // gráfico del mes
  const W = viewW(), H = 140, PL = 16, PR = 6, PT = 20, PB = 22, iw = W-PL-PR, ih = H-PT-PB;
  const st = mi.days.map(k => dayStats(k));
  const maxY = Math.max(1, ...st.map(x => x.total)), step = maxY <= 6 ? 1 : Math.ceil(maxY/5);
  const X = i => PL + i/(mi.n-1)*iw, Y = v => PT + ih - v/maxY*ih;
  const pts = [], sch = [];
  st.forEach((x,i) => { if(x.k <= end && x.k >= first){ pts.push([X(i), Y(x.n), x]); sch.push([X(i), Y(x.total)]); } });
  const P = a => a.map((p,i) => (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  let g = ''; for(let v=0; v<=maxY; v+=step) g += `<line x1="${PL}" x2="${W-PR}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="#ECEDF1"/><text x="0" y="${(Y(v)+3.5).toFixed(1)}" font-size="10" fill="#5F6270">${v}</text>`;
  [1,8,15,22,mi.n].forEach(d => g += `<text x="${X(d-1).toFixed(1)}" y="${H-5}" text-anchor="middle" font-size="10" fill="#5F6270">${d}</text>`);
  let chart = g;
  if(pts.length > 1) chart += `<path d="${P(sch)}" fill="none" stroke="#B9BCC6" stroke-width="1.1" stroke-dasharray="2 3"/><path d="${P(pts)} L${pts[pts.length-1][0].toFixed(1)} ${Y(0).toFixed(1)} L${pts[0][0].toFixed(1)} ${Y(0).toFixed(1)} Z" fill="#3447E6" opacity=".08"/><path d="${P(pts)}" fill="none" stroke="#3447E6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  chart += pts.map((p,i) => { const last = i === pts.length-1; return `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${last?4:2.4}" fill="${last?'#3447E6':'#fff'}" stroke="#3447E6" stroke-width="1.5"/>`; }).join('');
  if(pts.length){ const q = pts[pts.length-1]; chart += `<text x="${Math.min(q[0], W-18).toFixed(1)}" y="${Math.max(12, q[1]-10).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="500" fill="#16171C">${q[2].n}/${q[2].total}</text>`; }
  const bw = iw/(mi.n-1);
  chart += pts.map(p => `<rect class="hit" data-act="day" data-k="${p[2].k}" x="${(p[0]-bw/2).toFixed(1)}" y="0" width="${bw.toFixed(1)}" height="${H-PB}"><title>${esc(longDate(p[2].k))} · ${p[2].n} de ${p[2].total}</title></rect>`).join('');

  // tiras por hábito: 1 bloque por día, separación extra cada lunes
  const CW = 9, G = 2, WG = 5; const cx = []; let x = 0;
  mi.days.forEach((k,i) => { if(i) x += dow(k)===1 ? WG : G; cx.push(x); x += CW; });
  const SW = W - 44, sc = SW / x, bwid = CW*sc;
  const ticks = [1, 8, 15, 22, mi.n].filter((d,i,a) => a.indexOf(d)===i);
  const tdi = isCur ? +t.slice(8) : null;
  const tickHtml = ticks.filter(d => !(tdi && Math.abs(d - tdi) < 3)).map(d => `<span style="left:${((cx[d-1]+CW/2)*sc).toFixed(1)}px">${d}</span>`).join('') + (tdi ? `<span class="t" style="left:${((cx[tdi-1]+CW/2)*sc).toFixed(1)}px">hoy</span>` : '');
  const rows = hs.map(h => {
    let n = 0, tot = 0; let rects = '';
    mi.days.forEach((k,i) => {
      const xx = (cx[i]*sc).toFixed(1);
      if(!scheduledOn(h,k)){ rects += `<rect x="${(cx[i]*sc + bwid/2 - 1.5).toFixed(1)}" y="6.5" width="3" height="3" rx="1.5" fill="#C9CBD3"/>`; return; }
      if(k > t){ rects += `<rect x="${(+xx+.5).toFixed(1)}" y=".5" width="${(bwid-1).toFixed(1)}" height="15" rx="3" fill="none" stroke="#E7E8ED"/>`; return; }
      const on = (D.log[k]||[]).includes(h.id); tot++; if(on) n++;
      rects += `<rect x="${xx}" y="0" width="${bwid.toFixed(1)}" height="16" rx="3" fill="${on?'#3447E6':'#E4E6EC'}"${k===t?' stroke="#16171C" stroke-width="1.5"':''}/>`;
    });
    const canToday = isCur && scheduledOn(h, t) && activeOn(h, t), doneT = (D.log[t]||[]).includes(h.id);
    const inner = `<span class="r1"><b>${esc(h.name)}</b><span>${canToday?`<em>${doneT?'Hecho hoy':'Marcar hoy'}</em>`:''}${n}/${tot} · ${tot?Math.round(n/tot*100):0}%</span></span><svg width="${SW}" height="16" viewBox="0 0 ${SW} 16" aria-hidden="true" style="overflow:visible">${rects}</svg>`;
    return `<div class="mrow${canToday&&doneT?' done':''}">${canToday?`<button class="mb" data-act="mtoday" data-id="${h.id}" aria-pressed="${doneT}" aria-label="${esc(h.name)}: ${n} de ${tot}. Tocar para marcar hoy">${inner}</button>`:`<div class="mb">${inner}</div>`}<button class="ed" data-act="edit-habit" data-id="${h.id}" aria-label="Editar ${esc(h.name)}">${I.more}</button></div>`;
  }).join('');
  return head + `<div class="mchart wrap"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Hábitos completados por día">${chart}</svg></div>` + kpis +
    `<div class="wrap" style="padding-right:max(62px,env(safe-area-inset-right,0px))"><div class="mticks">${tickHtml}</div></div>${rows}
    <div class="mleg wrap"><span><i style="background:#3447E6"></i>Cumplido</span><span><i style="background:#E4E6EC"></i>No cumplido</span><span><i style="width:3px;height:3px;border-radius:2px;background:#C9CBD3"></i>Libre</span><span>Toca un punto del gráfico para ver ese día</span></div>
    <div class="wrap">${monthBars(UI.month)}</div>`;
}

/* ----- Hoy ----- */
function viewHoy(){
  const t = today(), s = dayStats(t), pct = s.total ? Math.round(s.n/s.total*100) : 0;
  const blocked = D.tasks.filter(isBlocked).sort(sortTasks);
  const head = `<div class="top wrap"><div class="toprow"><div><div class="eyebrow">Hoy · Semana ${isoWeek(t)}</div><h1 class="title" style="font-size:27px;letter-spacing:-.01em;margin-top:4px">${esc(longDate(t))}</h1></div><button class="icon44" data-act="settings" aria-label="Ajustes y respaldo">${I.gear}</button></div>${installHint()}</div>`;
  if(!D.habits.length && !D.tasks.length) return head + `<div class="wrap empty"><h3>Bienvenido a Traky 🤘</h3><p>Una hoja para tus hábitos y una lista de tareas donde cada una dice qué necesitas para avanzar: su palanca.</p><div class="acts"><button class="btn btn-p" data-act="new-habit">Crear un hábito</button><button class="btn btn-g" data-act="new-task">Crear una tarea</button></div><button class="btn btn-t" data-act="sample">Probar con datos de ejemplo</button></div>`;
  const habits = s.total ? `<div class="prog"><div style="display:flex;justify-content:space-between;align-items:baseline"><span class="big">${s.n}<small> / ${s.total}</small></span><span style="font-size:13.5px;color:var(--muted)">Racha de <b style="color:var(--fg)">${currentStreak()} días</b></span></div><div class="bar"><i style="width:${pct}%"></i></div></div>
    <div class="hlist">${s.sched.map(h => { const on=(D.log[t]||[]).includes(h.id), st=habitStreak(h); return `<button class="hrow" data-act="htoggle" data-id="${h.id}" data-k="${t}" aria-pressed="${on}"><span class="ck">${I.x.replace('stroke-width="2.2"','stroke-width="2.4" stroke="#fff"')}</span><span class="tx"><b>${esc(h.name)}</b><span>${esc(h.cat||'')}${h.cat&&st>1?' · ':''}${st>1?'racha '+st:''}</span></span></button>`; }).join('')}</div>`
    : `<p style="color:var(--muted);margin:4px 0 0">${D.habits.length?'No tienes hábitos programados para hoy.':'Aún no tienes hábitos.'}</p>`;
  const lev = blocked.length ? blocked.slice(0,6).map(tk => { const c=catOf(tk.cat), k=col(c); return `<button class="lvcard" data-act="edit-task" data-id="${tk.id}"><span class="from"><i style="background:${k.dot}"></i>${esc(c?c.name:'Sin categoría')} · ${esc(tk.title)}</span><span class="lv">${I.lever}<span>${esc(tk.palanca)}</span></span></button>`; }).join('')
    : `<p style="color:var(--muted);margin:0">Nada te está frenando. Cuando una tarea necesite algo para avanzar, escríbelo como palanca.</p>`;
  return head + `<div class="wrap">${habits}${D.habits.length?monthBars(null):''}<div class="blk"><h2><span>PALANCAS POR RESOLVER</span><span class="mono">${blocked.length||''}</span></h2>${lev}</div></div>`;
}

/* ----- Tareas ----- */
function viewTasks(){
  const f = UI.filter;
  const head0 = `<div class="toprow"><h1 class="title">TAREAS</h1><button class="fab" data-act="new-task" aria-label="Nueva tarea">${I.plus}</button></div>`;
  if(!D.tasks.length && !D.cats.length) return `<div class="top wrap">${head0}</div><div class="wrap empty" style="border-top:1px solid var(--line-2)"><h3>Organiza tus tareas por categoría</h3><p>Cada tarea tiene un ticket de box (qué hay que hacer) y una palanca: lo que te falta para poder ejecutarla.</p><div class="acts"><button class="btn btn-p" data-act="new-task">Crear primera tarea</button><button class="btn btn-t" data-act="sample">Ver con ejemplo</button></div></div>`;
  const K = [['pend','Pendientes',t=>t.status==='pendiente'],['prog','En curso',t=>t.status==='progreso'],['block','Bloqueadas',isBlocked],['done','Hechas',t=>t.status==='completada']];
  const match = f ? K.find(k=>k[0]===f)[2] : ()=>true;
  const names = {pend:'pendientes',prog:'en curso',block:'bloqueadas',done:'hechas'};
  let head = `<div class="top wrap">${head0}<div class="kgrid" role="group" aria-label="Filtrar por estado">${K.map(([id,l,fn]) => `<button class="kbtn${id==='block'?' blue':''}" data-act="filter" data-v="${id}" aria-pressed="${f===id}"><b>${D.tasks.filter(fn).length}</b><span>${l}</span></button>`).join('')}</div>
    ${f?`<div class="fbar"><span>Mostrando <b>${names[f]}</b></span><button data-act="filter" data-v="">Ver todas</button></div>`:''}</div>`;
  const cats = [...D.cats]; if(D.tasks.some(t=>!catOf(t.cat))) cats.push({id:'__none', name:'Sin categoría', color:'slate'});
  let body = '';
  for(const c of cats){
    const inCat = D.tasks.filter(t => c.id==='__none' ? !catOf(t.cat) : t.cat===c.id).sort(sortTasks);
    const shown = inCat.filter(match);
    if(f && !shown.length) continue;
    const k = col(c), expanded = f ? true : isOpen(c.id);
    const doneN = inCat.filter(t=>t.status==='completada').length;
    body += `<section aria-label="${esc(c.name)}"><div class="cathead" style="background:${k.tint};border-color:${k.line}">
      <button class="tog" data-act="fold" data-id="${c.id}" aria-expanded="${expanded}"><span class="dot" style="background:${k.dot}"></span><span class="nm" style="color:${k.ink}">${esc(c.name)}</span><span class="ct">${doneN}/${inCat.length}</span><span style="display:grid;transform:rotate(${expanded?0:-90}deg);transition:transform .2s">${I.chev}</span></button>
      ${c.id!=='__none'?`<button class="icon44 more" data-act="edit-cat" data-id="${c.id}" aria-label="Editar ${esc(c.name)}">${I.more}</button>`:''}</div>`;
    if(!expanded){
      const open = inCat.filter(t=>t.status!=='completada'), top = open[0];
      body += `<div class="deck" style="background:${k.tint};border-color:${k.line}"><button data-act="fold" data-id="${c.id}" aria-label="Abrir ${esc(c.name)}">
        ${open.length>2?`<span class="l2" style="box-shadow:0 0 0 1px ${k.line}"></span>`:''}${open.length>1?`<span class="l1" style="box-shadow:0 0 0 1px ${k.line}"></span>`:''}
        <span class="front" style="box-shadow:0 0 0 1px ${k.line},0 6px 16px -10px rgba(14,15,20,.25)">
        ${top?`<span class="t1"><b>${esc(top.title)}</b><span class="mono" style="font-size:12px;color:${isLate(top)?'var(--danger)':'var(--muted)'};flex:none">${esc(dateLabel(top))}</span></span>
        ${isBlocked(top)?`<span class="lvm">${I.lever}<span>${esc(top.palanca)}</span></span>`:''}
        <span class="more" style="color:${k.ink}">${open.length>1?`+ ${open.length-1} ${open.length===2?'tarea más':'tareas más'}`:'Única tarea abierta'}</span>`
        :`<span class="t1"><b style="color:var(--muted)">Todo listo en ${esc(c.name)}</b></span><span class="more" style="color:${k.ink}">${inCat.length?inCat.length+' hechas':'Sin tareas todavía'}</span>`}
        </span></button></div>`;
    } else {
      body += shown.length ? shown.map(taskRow).join('') : `<div class="wrap" style="padding-block:16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px"><span style="color:var(--muted)">Sin tareas todavía.</span><button class="btn btn-t" data-act="new-task" data-cat="${c.id}">Agregar</button></div>`;
    }
    body += `</section>`;
  }
  if(f && !body) body = `<div class="wrap empty"><h3>${f==='block'?'Nada te está frenando':'Sin tareas aquí'}</h3><p>${f==='block'?'Ninguna tarea abierta espera una palanca.':'Cuando haya tareas en este estado aparecerán en esta lista.'}</p></div>`;
  return head + `<div class="tsheet">${body}</div>`;
}
function taskRow(t){
  return `<div class="trow${t.status==='completada'?' done':''}">
    <button class="st" data-act="cycle" data-id="${t.id}" aria-label="${esc(t.title)}. Estado: ${ST_LABEL[t.status]}. Tocar para avanzar">${ST_ICON[t.status]}</button>
    <button class="op" data-act="edit-task" data-id="${t.id}">
      <span class="l1"><b>${esc(t.title)}</b>${t.date?`<span class="dt${isLate(t)?' late':''}">${esc(dateLabel(t))}</span>`:''}</span>
      ${t.desc?`<span class="ds">${esc(t.desc)}</span>`:''}
      ${isBlocked(t)?`<span class="lvchip">${I.lever}<span><em>PALANCA</em>${esc(t.palanca)}</span></span>`:''}
    </button></div>`;
}

/* ---------- bottom sheet ---------- */
let sheetEl = null, scrimEl = null, sheetY = 0;
function openSheet(html, mount){
  closeSheet(true);
  sheetY = window.scrollY;
  scrimEl = document.createElement('div'); scrimEl.className = 'scrim';
  sheetEl = document.createElement('div'); sheetEl.className = 'sheet'; sheetEl.setAttribute('role','dialog'); sheetEl.setAttribute('aria-modal','true');
  sheetEl.innerHTML = `<div class="grab"><span></span></div>${html}`;
  document.body.append(scrimEl, sheetEl);
  document.body.style.overflow = 'hidden';
  scrimEl.addEventListener('click', () => closeSheet());
  requestAnimationFrame(() => { scrimEl.classList.add('on'); sheetEl.classList.add('on'); });
  if(mount) mount(sheetEl);
  // arrastrar hacia abajo para cerrar
  let y0 = null, dy = 0; const g = sheetEl.querySelector('.grab');
  const start = e => { y0 = e.touches[0].clientY; dy = 0; sheetEl.style.transition = 'none'; };
  const move = e => { if(y0==null) return; dy = Math.max(0, e.touches[0].clientY - y0); sheetEl.style.transform = `translateY(${dy}px)`; };
  const end = () => { if(y0==null) return; sheetEl.style.transition = ''; sheetEl.style.transform = ''; if(dy > 90) closeSheet(); y0 = null; };
  [g, sheetEl.querySelector('.shead')].forEach(el => { if(!el) return; el.addEventListener('touchstart', start, {passive:true}); el.addEventListener('touchmove', move, {passive:true}); el.addEventListener('touchend', end); });
  return sheetEl;
}
function closeSheet(instant){
  if(!sheetEl) return;
  const s = sheetEl, c = scrimEl; sheetEl = scrimEl = null;
  document.body.style.overflow = '';
  if(instant){ s.remove(); c.remove(); return; }
  s.classList.remove('on'); c.classList.remove('on');
  setTimeout(() => { s.remove(); c.remove(); }, 280);
}
function fieldErr(root, name, on){ const el = root.querySelector(`[data-f="${name}"]`); if(el) el.classList.toggle('err', on); return on; }
function confirmSheet(title, text, label, fn){
  openSheet(`<div class="sb confirm"><div class="shead"><h3>${title}</h3></div><p>${text}</p></div><div class="sf"><button class="btn btn-g" data-close>Cancelar</button><button class="btn btn-d" style="flex:1" data-yes>${label}</button></div>`, s => {
    s.querySelector('[data-close]').onclick = () => closeSheet();
    s.querySelector('[data-yes]').onclick = () => { closeSheet(); fn(); };
  });
}

/* ----- day sheet ----- */
function daySheet(k){
  const t = today();
  const draw = () => {
    const s = dayStats(k), pct = s.total ? Math.round(s.n/s.total*100) : 0, log = D.log[k] || [];
    const off = activeHabits().filter(h => !scheduledOn(h,k) && (!h.createdAt || h.createdAt<=k));
    return `<div class="sb"><div class="shead"><div><div class="eyebrow">${k===t?'Hoy':esc(cap(fmt(k,{weekday:'long'})))} · Semana ${isoWeek(k)}</div><h3 style="margin-top:4px">${esc(longDate(k))}</h3></div>
      <div style="display:flex;gap:4px;margin-top:10px"><button class="icon44" data-nav="-1" aria-label="Día anterior" style="background:var(--sunken);width:40px;height:40px">${I.left}</button><button class="icon44" data-nav="1" aria-label="Día siguiente" style="background:var(--sunken);width:40px;height:40px" ${k>=t?'disabled':''}>${I.right}</button></div></div>
      ${k>t?'<p style="margin:0;color:var(--muted)">Este día aún no llega.</p>':s.total?`<div class="prog"><span class="big">${s.n}<small> / ${s.total}</small></span><div class="bar"><i style="width:${pct}%"></i></div></div>
      <div class="hlist">${s.sched.map(h => `<button class="hrow" data-h="${h.id}" aria-pressed="${log.includes(h.id)}"><span class="ck">${I.x.replace('stroke-width="2.2"','stroke-width="2.4" stroke="#fff"')}</span><span class="tx"><b>${esc(h.name)}</b><span>${esc(h.cat||'')}</span></span></button>`).join('')}</div>`
      :'<p style="margin:0;color:var(--muted)">No había hábitos programados este día.</p>'}
      ${off.length&&k<=t?`<p style="margin:0;font-size:13.5px;color:var(--muted)">No programados: ${off.map(h=>esc(h.name)).join(', ')}</p>`:''}
      </div><div class="sf"><button class="btn btn-p" data-close>Listo</button></div>`;
  };
  openSheet(draw(), function wire(s){
    s.addEventListener('click', e => {
      const h = e.target.closest('[data-h]'), n = e.target.closest('[data-nav]'), c = e.target.closest('[data-close]');
      if(c){ closeSheet(); return; }
      if(h){ const on = toggleHabit(h.dataset.h, k); h.setAttribute('aria-pressed', on); const st = dayStats(k); const big = s.querySelector('.big'); if(big) big.innerHTML = `${st.n}<small> / ${st.total}</small>`; const b = s.querySelector('.bar i'); if(b) b.style.width = (st.total?Math.round(st.n/st.total*100):0)+'%'; render(); return; }
      if(n){ const nk = addDays(k, +n.dataset.nav); if(nk > t) return; k = nk; if(k.slice(0,7)!==UI.month){ UI.month = k.slice(0,7); render(); } const grab = '<div class="grab"><span></span></div>'; s.innerHTML = grab + draw(); }
    });
  });
}

/* ----- habit sheet ----- */
function habitSheet(h){
  const isNew = !h; h = h || {name:'', cat:'', freq:'daily', days:[1,2,3,4,5]};
  let freq = h.freq, days = new Set(h.days && h.days.length ? h.days : [1,2,3,4,5]), cat = h.cat || '';
  const cats = [...new Set(D.habits.filter(x=>x.cat).map(x=>x.cat).concat(['Salud','Mente','Proyecto','Trabajo']))].slice(0,8);
  openSheet(`<div class="sb"><div class="shead"><h3>${isNew?'Nuevo hábito':'Editar hábito'}</h3></div>
    <div class="fld" data-f="name"><label for="hn">Nombre</label><input id="hn" type="text" maxlength="60" value="${esc(h.name)}" placeholder="Ej. Leer 20 minutos" autocomplete="off" enterkeyhint="done"><span class="em">Escribe un nombre para el hábito.</span></div>
    <div class="fld"><span class="lab">Categoría</span><div class="chips" id="hc">${cats.map(c=>`<button class="chip" data-c="${esc(c)}" aria-pressed="${c===cat}">${esc(c)}</button>`).join('')}<button class="chip" data-c="__new">+ Otra</button></div><input id="hcn" type="text" maxlength="30" placeholder="Nombre de la categoría" hidden autocomplete="off"></div>
    <div class="fld" data-f="days"><span class="lab">Frecuencia</span><div class="seg" style="grid-template-columns:1fr 1fr" id="hf"><button data-v="daily" aria-pressed="${freq==='daily'}">Diaria</button><button data-v="custom" aria-pressed="${freq==='custom'}">Días específicos</button></div>
      <div class="dayp" id="hd" ${freq==='daily'?'hidden':''}>${ORDER.map(d=>`<button data-d="${d}" aria-pressed="${days.has(d)}" aria-label="${DNAME[d]}">${L[d]}</button>`).join('')}</div><span class="em">Elige al menos un día.</span></div>
    ${isNew?'':`<div class="zone">
      <div class="zrow"><div><b>${h.archivedAt?'Reactivar hábito':'Archivar hábito'}</b><span>${h.archivedAt?'Vuelve a aparecer desde hoy. Su historial sigue intacto.':'Deja de aparecer desde hoy. Todo lo que marcaste se conserva y sigue visible en los meses anteriores.'}</span></div><button class="btn btn-g" data-arch>${h.archivedAt?'Reactivar':'Archivar'}</button></div>
      <div class="zrow"><div><b style="color:var(--danger)">Eliminar definitivamente</b><span>Borra el hábito y sus ${marksOf(h.id)} marcas de todos los meses. No se puede deshacer.</span></div><button class="btn btn-d" data-purge>Eliminar</button></div>
    </div>`}
  </div><div class="sf"><button class="btn btn-p" data-save>${isNew?'Crear hábito':'Guardar'}</button></div>`, s => {
    const cn = s.querySelector('#hcn');
    s.querySelector('#hc').onclick = e => { const b = e.target.closest('[data-c]'); if(!b) return; if(b.dataset.c==='__new'){ cn.hidden=false; cn.focus(); cat=''; s.querySelectorAll('#hc [data-c]').forEach(x=>x.setAttribute('aria-pressed', x===b)); return; } cn.hidden=true; cat = cat===b.dataset.c ? '' : b.dataset.c; s.querySelectorAll('#hc [data-c]').forEach(x=>x.setAttribute('aria-pressed', x.dataset.c===cat)); };
    s.querySelector('#hf').onclick = e => { const b = e.target.closest('button'); if(!b) return; freq = b.dataset.v; s.querySelectorAll('#hf button').forEach(x=>x.setAttribute('aria-pressed', x===b)); s.querySelector('#hd').hidden = freq==='daily'; };
    s.querySelector('#hd').onclick = e => { const b = e.target.closest('button'); if(!b) return; const d=+b.dataset.d; days.has(d)?days.delete(d):days.add(d); b.setAttribute('aria-pressed', days.has(d)); };
    s.querySelector('[data-save]').onclick = () => {
      const name = s.querySelector('#hn').value.trim(); const c = !cn.hidden ? cn.value.trim() : cat;
      const e1 = fieldErr(s,'name',!name), e2 = fieldErr(s,'days', freq==='custom' && !days.size); if(e1||e2) return;
      if(isNew) D.habits.push({id:uid('h'), name, cat:c, freq, days:[...days], createdAt:today(), archivedAt:null, sched:[{from:today(), freq, days:[...days]}], pauses:[]});
      else { const hh = D.habits.find(x=>x.id===h.id); Object.assign(hh, {name, cat:c}); setSchedule(hh, freq, [...days]); }
      closeSheet(); commit(); toast(isNew?'Hábito creado':'Hábito actualizado');
    };
    const arch = s.querySelector('[data-arch]');
    if(arch) arch.onclick = () => { const hh = D.habits.find(x=>x.id===h.id);
      if(hh.archivedAt){ restoreHabit(hh); closeSheet(); commit(); toast('Hábito reactivado'); return; }
      const created = hh.createdAt === today() && !marksOf(hh.id);
      if(created){ purgeHabit(hh.id); closeSheet(); commit(); toast('Hábito eliminado'); return; }
      archiveHabit(hh); closeSheet(); commit(); toast('Hábito archivado · historial guardado', () => { hh.archivedAt = null; commit(); }); };
    const purge = s.querySelector('[data-purge]');
    if(purge) purge.onclick = () => { const n = marksOf(h.id);
      confirmSheet('Eliminar definitivamente', `Se borrará <b>${esc(h.name)}</b> y sus <b>${n}</b> ${n===1?'marca':'marcas'} de todos los meses. Tus rachas y porcentajes se recalcularán sin él. Esto no se puede deshacer.`, 'Eliminar para siempre', () => { purgeHabit(h.id); commit(); toast('Hábito eliminado para siempre'); }); };
    if(isNew) setTimeout(()=>s.querySelector('#hn').focus(), 320);
  });
}

/* ----- task sheet ----- */
function taskSheet(t, presetCat){
  const isNew = !t;
  t = t || {title:'', desc:'', palanca:'', palancaOk:false, status:'pendiente', date:'', cat: presetCat || (D.cats[0]||{}).id || ''};
  let status = t.status, cat = t.cat, ok = !!t.palancaOk, newCatColor = COLOR_KEYS[D.cats.length % COLOR_KEYS.length];
  const catChips = () => D.cats.map(c => `<button class="chip" data-c="${c.id}" aria-pressed="${c.id===cat}"><i style="background:${col(c).dot}"></i>${esc(c.name)}</button>`).join('') + `<button class="chip" data-c="__new" aria-pressed="${cat==='__new'}">+ Nueva</button>`;
  const levBox = () => t.palanca ? `<div class="lvbox ${ok?'ok':'on'}" id="lvb"><div class="hd"><span class="tile">${I.lever}</span><span><b>${ok?'PALANCA RESUELTA':'PALANCA'}</b><span>Lo que necesitas para poder ejecutarla</span></span></div><p>${esc(t.palanca)}</p><button class="tg" data-lev>${ok?'Reabrir palanca':'Marcar como resuelta'}</button></div>` : '';
  openSheet(`<div class="sb"><div class="shead"><h3>${isNew?'Nueva tarea':'Editar tarea'}</h3></div>
    ${isNew?'':levBox()}
    <div class="fld" data-f="title"><label for="tt">Título</label><input id="tt" type="text" maxlength="100" value="${esc(t.title)}" placeholder="Ej. Crear landing page" autocomplete="off" enterkeyhint="next"><span class="em">La tarea necesita un título.</span></div>
    <div class="fld" data-f="cat"><span class="lab">Categoría</span><div class="chips" id="tc">${catChips()}</div>
      <div id="tcnew" ${cat==='__new'||!D.cats.length?'':'hidden'} style="display:flex;flex-direction:column;gap:10px"><input id="tcn" type="text" maxlength="30" placeholder="Ej. Personal, Laboral, Casa" autocomplete="off"><div class="colors" id="tcc">${COLOR_KEYS.map(k=>`<button data-k="${k}" aria-pressed="${k===newCatColor}" aria-label="Color ${k}"><span style="background:${COLORS[k].dot}"></span></button>`).join('')}</div></div>
      <span class="em">Elige o crea una categoría.</span></div>
    <div class="fld"><label for="td">Ticket de box</label><textarea id="td" rows="2" maxlength="300" placeholder="Qué hay que hacer y cuál es el resultado esperado.">${esc(t.desc)}</textarea></div>
    <div class="fld lev"><label for="tl">${I.lever}Palanca</label><textarea id="tl" rows="2" maxlength="200" placeholder="Ej. Tener definido el contenido y las referencias visuales.">${esc(t.palanca)}</textarea><span class="help">El recurso, acción, información o condición que desbloquea la tarea.</span></div>
    <div class="fld"><span class="lab">Estado</span><div class="seg" style="grid-template-columns:repeat(3,1fr)" id="ts">${['pendiente','progreso','completada'].map(s=>`<button data-v="${s}" aria-pressed="${s===status}">${ST_LABEL[s]}</button>`).join('')}</div></div>
    <div class="fld"><label for="tdt">Fecha <span style="text-transform:none;letter-spacing:0;font-weight:400">· opcional</span></label><input id="tdt" type="date" value="${esc(t.date||'')}"></div>
  </div><div class="sf">${isNew?'':`<button class="btn btn-d" data-del style="padding:0 16px">Eliminar</button>`}<button class="btn btn-p" data-save>${isNew?'Crear tarea':'Guardar'}</button></div>`, s => {
    if(!D.cats.length) cat = '__new';
    const nb = s.querySelector('#tcnew');
    s.querySelector('#tc').onclick = e => { const b = e.target.closest('[data-c]'); if(!b) return; cat = b.dataset.c; s.querySelectorAll('#tc [data-c]').forEach(x=>x.setAttribute('aria-pressed', x===b)); nb.hidden = cat!=='__new'; if(cat==='__new') s.querySelector('#tcn').focus(); };
    s.querySelector('#tcc').onclick = e => { const b = e.target.closest('[data-k]'); if(!b) return; newCatColor = b.dataset.k; s.querySelectorAll('#tcc [data-k]').forEach(x=>x.setAttribute('aria-pressed', x===b)); };
    s.querySelector('#ts').onclick = e => { const b = e.target.closest('button'); if(!b) return; status = b.dataset.v; s.querySelectorAll('#ts button').forEach(x=>x.setAttribute('aria-pressed', x===b)); };
    s.addEventListener('click', e => { if(e.target.closest('[data-lev]')){ ok = !ok; if(ok && status==='pendiente'){ status='progreso'; s.querySelectorAll('#ts button').forEach(x=>x.setAttribute('aria-pressed', x.dataset.v===status)); } const lb = s.querySelector('#lvb'); lb.outerHTML = levBox(); } });
    s.querySelector('[data-save]').onclick = () => {
      const title = s.querySelector('#tt').value.trim(); const ncn = s.querySelector('#tcn').value.trim();
      const e1 = fieldErr(s,'title',!title), e2 = fieldErr(s,'cat', (cat==='__new' && !ncn) || (!cat)); if(e1||e2) return;
      let cid = cat;
      if(cat==='__new'){ const ex = D.cats.find(c=>c.name.toLowerCase()===ncn.toLowerCase()); if(ex) cid = ex.id; else { cid = uid('c'); D.cats.push({id:cid, name:ncn, color:newCatColor}); } }
      const palanca = s.querySelector('#tl').value.trim();
      const data = {title, cat:cid, desc:s.querySelector('#td').value.trim(), palanca, palancaOk: palanca ? (palanca===t.palanca ? ok : false) : false, status, date:s.querySelector('#tdt').value || ''};
      if(isNew) D.tasks.push(Object.assign({id:uid('t'), createdAt:Date.now()}, data)); else Object.assign(D.tasks.find(x=>x.id===t.id), data);
      closeSheet(); commit(); toast(isNew?'Tarea creada':'Tarea guardada');
    };
    const del = s.querySelector('[data-del]');
    if(del) del.onclick = () => { const idx = D.tasks.findIndex(x=>x.id===t.id), snap = D.tasks[idx]; D.tasks.splice(idx,1); closeSheet(); commit(); toast('Tarea eliminada', () => { D.tasks.splice(idx,0,snap); commit(); }); };
    if(isNew) setTimeout(()=>s.querySelector('#tt').focus(), 320);
  });
}

/* ----- category sheet ----- */
function catSheet(c){
  let color = c.color || 'slate';
  const n = D.tasks.filter(t=>t.cat===c.id).length;
  openSheet(`<div class="sb"><div class="shead"><h3>Categoría</h3></div>
    <div class="fld" data-f="name"><label for="cn">Nombre</label><input id="cn" type="text" maxlength="30" value="${esc(c.name)}" autocomplete="off"><span class="em">Escribe un nombre.</span></div>
    <div class="fld"><span class="lab">Color</span><div class="colors" id="cc">${COLOR_KEYS.map(k=>`<button data-k="${k}" aria-pressed="${k===color}" aria-label="Color ${k}"><span style="background:${COLORS[k].dot}"></span></button>`).join('')}</div></div>
  </div><div class="sf"><button class="btn btn-d" data-del style="padding:0 16px">Eliminar</button><button class="btn btn-p" data-save>Guardar</button></div>`, s => {
    s.querySelector('#cc').onclick = e => { const b = e.target.closest('[data-k]'); if(!b) return; color = b.dataset.k; s.querySelectorAll('#cc [data-k]').forEach(x=>x.setAttribute('aria-pressed', x===b)); };
    s.querySelector('[data-save]').onclick = () => { const name = s.querySelector('#cn').value.trim(); if(fieldErr(s,'name',!name)) return; Object.assign(D.cats.find(x=>x.id===c.id), {name, color}); closeSheet(); commit(); };
    s.querySelector('[data-del]').onclick = () => confirmSheet('Eliminar categoría', `¿Eliminar <b>${esc(c.name)}</b>${n?` y sus <b>${n}</b> ${n===1?'tarea':'tareas'}`:''}? No se puede deshacer.`, 'Eliminar', () => { D.cats = D.cats.filter(x=>x.id!==c.id); D.tasks = D.tasks.filter(t=>t.cat!==c.id); commit(); toast('Categoría eliminada'); });
  });
}

/* ----- settings / backup ----- */
function settingsSheet(){
  const acct = USER
    ? `<div class="setrow"><span class="eyebrow">Cuenta</span><div class="acct"><span class="av" aria-hidden="true">${esc((USER.name||USER.email||'?').trim().charAt(0).toUpperCase())}</span><div><b>${esc(USER.name || USER.email)}</b>${USER.name?`<span>${esc(USER.email)}</span>`:''}</div></div>
      <div class="sync" data-sync data-state="${Sync.state}"><i></i><span>${Sync.label()}</span></div>
      <div class="acts"><button class="btn btn-g" data-out>Cerrar sesión</button></div></div>`
    : `<div class="setrow"><span class="eyebrow">Cuenta</span><p>Estás usando Traky solo en este teléfono. Entra con Google para guardar tus datos en tu cuenta y verlos en cualquier dispositivo. Lo que tienes ahora se sube al entrar.</p>
      <div class="acts"><button class="btn btn-p" data-in>Entrar con Google</button></div></div>`;
  openSheet(`<div class="sb"><div class="shead"><h3>Ajustes</h3></div>
    ${acct}
    <div class="setrow"><span class="eyebrow">Respaldo</span><p>${USER?'Tus datos se guardan en tu cuenta. Igual puedes exportar un archivo de respaldo cuando quieras.':'Tus datos viven en este teléfono. Exporta un archivo de respaldo de vez en cuando; con él puedes recuperar todo o pasarlo a otro dispositivo.'}</p>
      <div class="acts"><button class="btn btn-g" data-exp>Exportar respaldo</button><label class="btn btn-g" for="imp">Importar respaldo</label><input id="imp" type="file" accept="application/json,.json" hidden></div></div>
    ${D.habits.some(h=>h.archivedAt)?`<div class="setrow"><span class="eyebrow">Hábitos archivados</span><p>No aparecen en los días nuevos, pero su historial sigue en tus meses anteriores.</p>
      <div>${D.habits.filter(h=>h.archivedAt).map(h=>`<div class="arow"><div><b>${esc(h.name)}</b><span>Archivado el ${esc(shortDate(h.archivedAt))} · ${marksOf(h.id)} marcas</span></div><button style="background:var(--sunken);color:var(--accent)" data-restore="${h.id}">Reactivar</button><button style="background:#FDECEA;color:var(--danger)" data-purge="${h.id}">Eliminar</button></div>`).join('')}</div></div>`:''}
    <div class="setrow"><span class="eyebrow">Datos</span><p>${D.habits.length} hábitos · ${D.tasks.length} tareas · ${D.cats.length} categorías</p>
      <div class="acts"><button class="btn btn-t" data-wipe style="color:var(--danger)">Borrar todos los datos</button></div></div>
    <p style="margin:0;font-size:12.5px;color:var(--faint)">Traky 🤘 · v4</p>
  </div><div class="sf"><button class="btn btn-p" data-close>Listo</button></div>`, s => {
    s.querySelector('[data-close]').onclick = () => closeSheet();
    s.querySelector('[data-exp]').onclick = exportData;
    const out = s.querySelector('[data-out]'); if(out) out.onclick = signOut;
    const inb = s.querySelector('[data-in]'); if(inb) inb.onclick = () => { ls.del('traky.mode'); signIn(); };
    s.querySelectorAll('[data-restore]').forEach(b => b.onclick = () => { restoreHabit(D.habits.find(h=>h.id===b.dataset.restore)); closeSheet(); commit(); toast('Hábito reactivado'); });
    s.querySelectorAll('[data-purge]').forEach(b => b.onclick = () => { const h = D.habits.find(x=>x.id===b.dataset.purge), n = marksOf(h.id); confirmSheet('Eliminar definitivamente', `Se borrará <b>${esc(h.name)}</b> y sus <b>${n}</b> ${n===1?'marca':'marcas'} de todos los meses. Esto no se puede deshacer.`, 'Eliminar para siempre', () => { purgeHabit(h.id); commit(); toast('Hábito eliminado para siempre'); }); });
    s.querySelector('#imp').onchange = e => { const f = e.target.files[0]; if(f) importData(f); };
    s.querySelector('[data-wipe]').onclick = () => confirmSheet('Borrar todos los datos', (USER?'Se eliminarán tus hábitos, historial, tareas y categorías de tu cuenta y de este teléfono.':'Se eliminarán tus hábitos, historial, tareas y categorías de este teléfono.')+' Exporta un respaldo antes si quieres conservarlos.', 'Borrar todo', () => { D = fresh(); commit(); toast('Datos borrados'); });
  });
}
async function exportData(){
  const name = `traky-respaldo-${today()}.json`;
  const blob = new Blob([JSON.stringify(D, null, 2)], {type:'application/json'});
  try{
    const file = new File([blob], name, {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:'Respaldo de Traky'}); return; }
  }catch(e){ if(e && e.name==='AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.append(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function importData(file){
  const r = new FileReader();
  r.onload = () => {
    try{ const d = JSON.parse(r.result); if(!d || !Array.isArray(d.habits) || !Array.isArray(d.tasks)) throw 0;
      confirmSheet('Importar respaldo', `El archivo tiene ${d.habits.length} hábitos y ${d.tasks.length} tareas. Reemplazará lo que tienes ahora${USER?' en tu cuenta':' en este teléfono'}.`, 'Importar', () => { D = migrate(Object.assign(fresh(), d, {meta:Object.assign(fresh().meta, d.meta||{})})); commit(); toast('Respaldo importado'); });
    }catch(e){ toast('Ese archivo no es un respaldo de Traky'); }
  };
  r.readAsText(file);
}

/* ---------- sample data ---------- */
function loadSample(){
  const t = today(), start = addDays(t, -40);
  const H = [['Leer 20 minutos','Mente','daily',[]],['Entrenar','Salud','custom',[1,3,5]],['Meditar 10 min','Mente','daily',[]],['Escribir 500 palabras','Proyecto','custom',[1,2,3,4,5]],['Tomar 2 L de agua','Salud','daily',[]]];
  const ids = H.map(([name,cat,freq,days]) => { const id = uid('h'); D.habits.push({id,name,cat,freq,days,createdAt:start,archivedAt:null,sched:[{from:start,freq,days}],pauses:[]}); return id; });
  let seed = 11; const rnd = () => (seed = (seed*9301+49297)%233280)/233280;
  for(let k=start; k<t; k=addDays(k,1)){ const done = ids.filter((id,i) => scheduledOn(D.habits.find(h=>h.id===id),k) && rnd() < .55 + .35*Math.sin((dparse(k).getDate()+i)/4)**2); if(done.length) D.log[k] = done; }
  D.log[t] = [ids[0], ids[4]];
  const C = [['Personal','teal'],['Laboral','amber'],['Casa','rose']].map(([name,color]) => { const id = uid('c'); D.cats.push({id,name,color}); return id; });
  const T = [
    [0,'Crear landing page','Diseñar y publicar la primera versión.','Tener definido el contenido y las referencias visuales.','progreso',addDays(t,6)],
    [0,'Elegir dominio','Comprarlo y apuntarlo al hosting.','Decidir el nombre definitivo.','pendiente',addDays(t,3)],
    [0,'Escribir manifiesto','Una página que explique por qué existe.','','completada',''],
    [1,'Propuesta para cliente','Alcance, plazos y valor; enviar el viernes.','Recibir el brief final del cliente.','pendiente',addDays(t,4)],
    [1,'Reporte mensual de campañas','Resultados del mes con recomendaciones.','','progreso',addDays(t,-1)],
    [2,'Reparar llave del baño','Cambiar el cartucho para que no gotee.','Comprar el repuesto correcto.','pendiente','']
  ];
  T.forEach(([c,title,desc,palanca,status,date]) => D.tasks.push({id:uid('t'), cat:C[c], title, desc, palanca, palancaOk:false, status, date, createdAt:Date.now()}));
  D.meta.mantra[t.slice(0,7)] = D.meta.mantra[t.slice(0,7)] || 'Ser intencional';
  commit(); toast('Ejemplo cargado. Bórralo desde Ajustes en Hoy.');
}

/* ---------- toast ---------- */
let toastT;
function toast(msg, undo){
  const el = document.getElementById('toast');
  el.innerHTML = `<span>${esc(msg)}</span>${undo?'<button id="undo">Deshacer</button>':''}`;
  if(undo) el.querySelector('#undo').onclick = () => { undo(); el.classList.remove('on'); };
  el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), undo ? 5000 : 2400);
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if(!a || (sheetEl && sheetEl.contains(a))) return;
  const act = a.dataset.act, id = a.dataset.id;
  switch(act){
    case 'hview': UI.hview = a.dataset.v; if(UI.hview==='month') UI.month = UI.sel.slice(0,7); render(); window.scrollTo(0,0); break;
    case 'wday': UI.sel = a.dataset.k; render(); break;
    case 'week': { const n = addDays(UI.sel, +a.dataset.n); UI.sel = n > today() ? today() : n; render(); break; }
    case 'wtoggle': { toggleHabit(id, UI.sel); render(); const b = document.querySelector(`.wck[data-id="${id}"]`); if(b && b.getAttribute('aria-pressed')==='true') b.classList.add('pop'); break; }
    case 'mtoday': toggleHabit(id, today()); render(); break;
    case 'htoggle': toggleHabit(id, a.dataset.k); render(); break;
    case 'day': daySheet(a.dataset.k); break;
    case 'month': { const [y,m] = UI.month.split('-').map(Number); const d = new Date(y, m-1+(+a.dataset.n), 1); const nm = `${d.getFullYear()}-${p2(d.getMonth()+1)}`; if(nm <= today().slice(0,7)){ UI.month = nm; const ms = monthInfo(nm); UI.sel = ms.end < today() ? ms.end : today(); render(); } break; }
    case 'new-habit': habitSheet(); break;
    case 'edit-habit': habitSheet(D.habits.find(h=>h.id===id)); break;
    case 'new-task': taskSheet(null, a.dataset.cat); break;
    case 'edit-task': taskSheet(D.tasks.find(t=>t.id===id)); break;
    case 'cycle': { const t = D.tasks.find(x=>x.id===id), prev = t.status; t.status = ST_NEXT[t.status]; commit(); if(t.status==='completada') toast('Tarea completada', () => { t.status = prev; commit(); }); break; }
    case 'filter': UI.filter = a.dataset.v ? (UI.filter===a.dataset.v ? null : a.dataset.v) : null; render(); break;
    case 'fold': D.meta.open[id] = !isOpen(id); commit(); break;
    case 'edit-cat': catSheet(D.cats.find(c=>c.id===id)); break;
    case 'settings': settingsSheet(); break;
    case 'goto-month': UI.month = a.dataset.ym; { const ms = monthInfo(UI.month); UI.sel = ms.end < today() ? ms.end : today(); } UI.hview = 'month'; if(route()!=='habitos') location.hash = 'habitos'; else { render(); window.scrollTo(0,0); } break;
    case 'sample': loadSample(); break;
    case 'hide-hint': try{ localStorage.setItem('traky.hint','1'); }catch(e){} render(); break;
  }
});
let mT;
document.addEventListener('input', e => {
  const el = e.target; if(!el.dataset || !el.dataset.mantra) return;
  D.meta.mantra[el.dataset.mantra] = el.value; clearTimeout(mT); mT = setTimeout(() => Store.save(D), 400);
});
document.addEventListener('keydown', e => { if(e.key==='Enter' && e.target.dataset && e.target.dataset.mantra) e.target.blur(); if(e.key==='Escape' && sheetEl) closeSheet(); });
document.addEventListener('visibilitychange', () => { if(!document.hidden && lastDay !== today()){ UI.month = today().slice(0,7); UI.sel = today(); render(); } });
let rzT; window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(render, 120); });

/* ---------- boot ---------- */
async function boot(){
  document.body.classList.add('auth');
  document.getElementById('view').innerHTML = '<div class="login wrap"><div class="lg-mark" aria-hidden="true">🤘</div></div>';
  if(!sb){ useLocal(); return; }
  const back = /access_token=|error_description=/.test(location.hash);
  let session = null;
  try{ const r = await sb.auth.getSession(); session = r.data && r.data.session; }catch(e){}
  if(/error_description=/.test(location.hash)) setTimeout(() => toast('No se pudo entrar con Google. Intenta de nuevo.'), 300);
  if(back) history.replaceState(null, '', location.pathname + '#habitos');
  if(session){ await enterUser(session.user); openApp(); }
  else {
    const last = (() => { try{ return JSON.parse(ls.get('traky.lastUser')); }catch(e){ return null; } })();
    if(last && last.id && readLocal(LOCAL_KEY + '.' + last.id) && !navigator.onLine){
      // Sin conexión: abre la copia del teléfono y sincroniza al volver la señal.
      USER = last; KEY = LOCAL_KEY + '.' + last.id; D = migrate(Store.load()); Sync.state = 'error'; openApp();
    }
    else if(ls.get('traky.mode') === 'local'){ useLocal(); }
    else showLogin();
  }
  sb.auth.onAuthStateChange((ev, s) => {
    if(ev === 'SIGNED_IN' && s && (!USER || USER.id !== s.user.id) && document.body.classList.contains('auth')) enterUser(s.user).then(openApp);
  });
}
const resync = () => { if(USER && !document.hidden) Sync.pull(); };
document.addEventListener('visibilitychange', resync);
window.addEventListener('online', async () => { if(!USER) return; try{ await sb.auth.getSession(); }catch(e){} Sync.pull(); });
boot();
if('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
